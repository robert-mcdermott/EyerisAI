[General]
save_directory = captures
ai_description = true
log_file = motion_events.jsonl
instance_name = Home Security Camera 1
# AI Alert Filtering: When true, only log/alert if AI confirms the event is noteworthy
ai_alert_filtering = true
# What should the AI look for to trigger an alert? (e.g., "humans or people", "a person falling", "vehicles")
#alert_criteria = humans or people 
alert_criteria = a botle of soda or other drink seen

[Camera]
device_id = 0
width = 1920
height = 1080
auto_exposure = 0.75

[MotionDetection]
min_area = 700
blur_size_x = 21
blur_size_y = 21
threshold = 50
cooldown = 3

[Visualization]
# OpenCV uses BGR format (not RGB)
draw_contours = true
contour_color = 232, 8, 255
contour_thickness = 2
draw_timestamp = true
timestamp_color = 0,255,0

[TTS]
# Speak the description of the image
enabled = false
rate = 150
volume = 0.9 

[AI]
# Ollama model and endpoint
#model = moondream
model = qwen2.5vl:latest
base_url = http://localhost:11434
# Any OpenAI compatible API endpoint:
#model = gpt4o
#base_url = https://api.openai.com/v1
api_key = sk-12345
# Base prompt for AI image analysis (alert_criteria will be automatically appended when ai_alert_filtering is enabled)
prompt = You are a security camera system that has detected motion. The areas where motion was detected are indicated with magenta contours. If there is bottle of soda or other beverage then you should alert.
max_tokens = 400

[Email]
enabled = false
smtp_server = 
smtp_port = 25
smtp_username =
smtp_password =
from_address = EyerisAI-camera@emaildomain.com
to_address = 
use_tls = true
